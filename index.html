<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyProxy CA Certificate</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 400px;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #aeaeb2;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background: #ff9500;
            color: #000;
            padding: 16px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }
        .steps {
            text-align: left;
            margin-top: 40px;
            background: #1c1c1e;
            padding: 20px;
            border-radius: 12px;
        }
        .step {
            display: flex;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        .step-number {
            background: #ff9500;
            color: #000;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .step-text {
            font-size: 14px;
            color: #aeaeb2;
        }
        .step-title {
            color: #fff;
            font-weight: 600;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔒</div>
        <h1>MyProxy CA Sertifikası</h1>
        <p>MITM proxy için CA sertifikasını indirin ve yükleyin</p>
        
        <a href="ca-cert.mobileconfig" class="btn" download>
            📥 Sertifikayı İndir
        </a>
        
        <div class="steps">
            <div class="step">
                <div class="step-number">1</div>
                <div>
                    <div class="step-title">Sertifikayı İndir</div>
                    <div class="step-text">Yukarıdaki butona tıklayın</div>
                </div>
            </div>
            <div class="step">
                <div class="step-number">2</div>
                <div>
                    <div class="step-title">Profili Kur</div>
                    <div class="step-text">İndirilen dosyayı açın ve 'Kur' deyin</div>
                </div>
            </div>
            <div class="step">
                <div class="step-number">3</div>
                <div>
                    <div class="step-title">Güven Ayarları</div>
                    <div class="step-text">Ayarlar > Genel > VPN ve Cihaz Yönetimi > Sertifikaya Tam Güven verin</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
